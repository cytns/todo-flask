<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
</head>
<body>
    <h1>Список задач</h1>

    <form action="/add" method="post">
        <input type="text" name="task" placeholder="Введите задачу">
        <button type="submit">Добавить</button>
    </form>

    <ul>
        {% for task in tasks %}
            <li>{{ task["title"] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
