<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
</head>
<body>
    <h1>Список задач</h1>
    <form action="/add" method="post">
        <input
            type="text"
            name="task"
            placeholder="Введите задачу"
        >

        <button type="submit">
            Добавить
        </button>
    </form>
    <ul>
        {% for task in tasks %}
            <li>
                {% if task["is_done"] %}
                    <s>{{ task["title"] }}</s>
                {% else %}
                    {{ task["title"] }}

                    <a href="/done/{{ task['id'] }}">
                        Выполнено
                    </a>
                {% endif %}

                <a href="/delete/{{ task['id'] }}">
                    Удалить
                </a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
